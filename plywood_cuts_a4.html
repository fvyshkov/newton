<!doctype html><html><head><meta charset="utf-8"><style>@page{size:A4 portrait;margin:0}html,body{margin:0;padding:0;width:210mm;height:297mm}svg{display:block;width:210mm;height:297mm}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" font-family="Helvetica, Arial, sans-serif">
  <style>
    .ttl { font: bold 5px Helvetica, Arial, sans-serif; fill: #fff; }
    .sub { font: 2.6px Helvetica, Arial, sans-serif; fill: #cfd8dc; }
    .sech { font: bold 3px Helvetica, Arial, sans-serif; fill: #fff; }
    .lbl { font: bold 2.6px Helvetica, Arial, sans-serif; fill: #1a2b3c; }
    .qty { font: bold 2.4px Helvetica, Arial, sans-serif; fill: #b8860b; }
    .nt { font: italic 2.0px Helvetica, Arial, sans-serif; fill: #555; }
    .dim { font: 2.4px Helvetica, Arial, sans-serif; fill: #c0392b; }
    .ds { font: 1.9px Helvetica, Arial, sans-serif; fill: #c0392b; }
    .hl { font: 1.7px Helvetica, Arial, sans-serif; fill: #1565c0; }
    .part { fill: #fdf6e3; stroke: #2c3e50; stroke-width: 0.5; }
    .hole { fill: white; stroke: #1565c0; stroke-width: 0.3; }
    .env { fill: none; stroke: #888; stroke-width: 0.25; stroke-dasharray: 1.2,1.0; }
    .axisL { stroke: #999; stroke-width: 0.18; stroke-dasharray: 0.8,0.8; fill: none; }
    .dimL { stroke: #c0392b; stroke-width: 0.25; fill: none; marker-end: url(#a); marker-start: url(#a); }
    .secbar { fill: #34495e; }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- HEADER -->
  <rect x="0" y="0" width="210" height="13" fill="#1a2b3c"/>
  <text x="105" y="6" text-anchor="middle" class="ttl">ВЫПИЛЫ ИЗ ФАНЕРЫ 18 мм</text>
  <text x="105" y="10" text-anchor="middle" class="sub">Ньютон 200/1200 (Dobson, Stellafane-cтиль) · 11 деталей с 2 листов · все размеры в мм</text>

  <!-- ============ SECTION 1: MIRROR CELL ============ -->
  <rect x="0" y="14" width="210" height="4.5" class="secbar"/>
  <text x="3" y="17.6" class="sech">1.  ОПРАВА ГЛАВНОГО ЗЕРКАЛА  ·  2 детали  ·  лист 60×120</text>

  <!-- Part 1A: Front plate Ø215 -->
  <g transform="translate(50,48)">
    <g transform="scale(0.1429)">
      <circle cx="0" cy="0" r="107.5" class="part"/>
      <!-- 3 push (нажимных), R=95, по направлениям ушей Y-пластины -->
      <circle cx="0" cy="-95" r="3" class="hole"/>
      <circle cx="82.27" cy="47.5" r="3" class="hole"/>
      <circle cx="-82.27" cy="47.5" r="3" class="hole"/>
      <!-- 3 pull (прижимных), R=80, между нажимными -->
      <circle cx="69.28" cy="-40" r="3" class="hole"/>
      <circle cx="0" cy="80" r="3" class="hole"/>
      <circle cx="-69.28" cy="-40" r="3" class="hole"/>
      <!-- center cross -->
      <line x1="-12" y1="0" x2="12" y2="0" class="axisL"/>
      <line x1="0" y1="-12" x2="0" y2="12" class="axisL"/>
    </g>
    <text x="0" y="-19" text-anchor="middle" class="lbl">Передняя пластина</text>
    <text x="0" y="-16" text-anchor="middle" class="qty">1 шт</text>
    <text x="0" y="20" text-anchor="middle" class="dim">круг Ø 215  ·  6 отв. Ø 6 мм</text>
    <text x="0" y="23" text-anchor="middle" class="ds">3 нажимных на R=95 через 120° (по ушам Y)</text>
    <text x="0" y="25.5" text-anchor="middle" class="ds">3 прижимных на R=80 между ними (через 60°)</text>
  </g>

  <!-- Part 1B: Y-plate (rear) -->
  <g transform="translate(155,48)">
    <g transform="scale(0.1429)">
      <!-- envelope Ø250 (dashed) -->
      <circle cx="0" cy="0" r="125" class="env"/>
      <!-- Y body: union of 3 ear circles R=75 at distance 50 from origin -->
      <path d="M 74.68,-43.12
               A 75,75 0 1,0 -74.68,-43.12
               A 75,75 0 1,0 0,86.24
               A 75,75 0 1,0 74.68,-43.12 Z" class="part"/>
      <!-- 6 push/pull через обе пластины (сквозные, Ø6) -->
      <!-- 3 нажимных, R=95 -->
      <circle cx="0" cy="-95" r="3" class="hole"/>
      <circle cx="82.27" cy="47.5" r="3" class="hole"/>
      <circle cx="-82.27" cy="47.5" r="3" class="hole"/>
      <!-- 3 прижимных, R=80 -->
      <circle cx="69.28" cy="-40" r="3" class="hole"/>
      <circle cx="0" cy="80" r="3" class="hole"/>
      <circle cx="-69.28" cy="-40" r="3" class="hole"/>
      <!-- 3 шурупа в ушах к трубе, R=115 (Ø5) -->
      <circle cx="0" cy="-115" r="2.5" class="hole"/>
      <circle cx="99.59" cy="57.5" r="2.5" class="hole"/>
      <circle cx="-99.59" cy="57.5" r="2.5" class="hole"/>
      <!-- center cross -->
      <line x1="-15" y1="0" x2="15" y2="0" class="axisL"/>
      <line x1="0" y1="-15" x2="0" y2="15" class="axisL"/>
    </g>
    <text x="0" y="-19" text-anchor="middle" class="lbl">Задняя Y-пластина</text>
    <text x="0" y="-16" text-anchor="middle" class="qty">1 шт</text>
    <text x="0" y="22" text-anchor="middle" class="dim">вписана в Ø 250 (= ID трубы)  ·  3 уха через 120°</text>
    <text x="0" y="25" text-anchor="middle" class="ds">6 отв. Ø 6 (совпадают с передней): 3×R=95 + 3×R=80</text>
    <text x="0" y="27.5" text-anchor="middle" class="ds">+ 3 отв. Ø 5 в ушах (R=115) под шурупы к трубе</text>
  </g>

  <!-- ============ SECTION 2: CRADLE + BEARINGS ============ -->
  <rect x="0" y="80" width="210" height="4.5" class="secbar"/>
  <text x="3" y="83.6" class="sech">2.  ЛЮЛЬКА ТРУБЫ  +  ВЫСОТНЫЕ ПОДШИПНИКИ  ·  4 детали  ·  лист 60×120</text>

  <!-- Part 2A: Cradle ring -->
  <g transform="translate(55,118)">
    <g transform="scale(0.1429)">
      <!-- outer ring -->
      <circle cx="0" cy="0" r="160" class="part"/>
      <!-- inner cutout -->
      <circle cx="0" cy="0" r="129" fill="white" stroke="#2c3e50" stroke-width="0.5"/>
      <!-- 4 screw holes for battens at corners (45°/135°/225°/315°) on R=145 -->
      <circle cx="102.5" cy="-102.5" r="3" class="hole"/>
      <circle cx="102.5" cy="102.5" r="3" class="hole"/>
      <circle cx="-102.5" cy="-102.5" r="3" class="hole"/>
      <circle cx="-102.5" cy="102.5" r="3" class="hole"/>
      <line x1="-14" y1="0" x2="14" y2="0" class="axisL"/>
      <line x1="0" y1="-14" x2="0" y2="14" class="axisL"/>
    </g>
    <text x="0" y="-26" text-anchor="middle" class="lbl">Кольцо люльки</text>
    <text x="0" y="-23" text-anchor="middle" class="qty">2 шт (одинаковые)</text>
    <text x="0" y="25" text-anchor="middle" class="dim">OD 320  ·  ID 258  (= сонотуб Ø250 + 4 мм)</text>
    <text x="0" y="28" text-anchor="middle" class="ds">4 отв. Ø 4 под саморезы в брус 30×30 (по углам)</text>
  </g>

  <!-- Part 2B: Side bearing -->
  <g transform="translate(155,118)">
    <g transform="scale(0.1429)">
      <circle cx="0" cy="0" r="100" class="part"/>
      <!-- 4 screw holes to attach to cradle battens (at top, R=70) -->
      <circle cx="0" cy="-70" r="2.5" class="hole"/>
      <circle cx="0" cy="70" r="2.5" class="hole"/>
      <circle cx="-70" cy="0" r="2.5" class="hole"/>
      <circle cx="70" cy="0" r="2.5" class="hole"/>
      <line x1="-14" y1="0" x2="14" y2="0" class="axisL"/>
      <line x1="0" y1="-14" x2="0" y2="14" class="axisL"/>
    </g>
    <text x="0" y="-21" text-anchor="middle" class="lbl">Высотный подшипник</text>
    <text x="0" y="-18" text-anchor="middle" class="qty">2 шт (одинаковые)</text>
    <text x="0" y="18" text-anchor="middle" class="dim">круг Ø 200</text>
    <text x="0" y="21" text-anchor="middle" class="ds">4 отв. Ø 4 под саморезы к боку люльки</text>
    <text x="0" y="23.5" text-anchor="middle" class="ds">по торцу обклеить PTFE-полосой 25 мм</text>
  </g>

  <!-- ============ SECTION 3: ROCKER BOX ============ -->
  <rect x="0" y="143" width="210" height="4.5" class="secbar"/>
  <text x="3" y="146.6" class="sech">3.  РОКЕР-БОКС  ·  4 детали  ·  лист 80×120</text>

  <!-- Part 3A: Side wall with R100 cutout -->
  <g transform="translate(38,185)">
    <g transform="scale(0.1429)">
      <!-- 350x350 square with R100 semicircle cut into top edge -->
      <path d="M -175,-175 L -100,-175 A 100,100 0 0,1 100,-175 L 175,-175 L 175,175 L -175,175 Z"
            class="part"/>
      <!-- 2 PTFE pad locations on the arc, ±45° from deepest point -->
      <circle cx="-70.7" cy="-104.3" r="10" class="hole"/>
      <circle cx="70.7" cy="-104.3" r="10" class="hole"/>
      <!-- cutout center marker -->
      <line x1="-8" y1="-175" x2="8" y2="-175" class="axisL"/>
      <line x1="0" y1="-183" x2="0" y2="-75" class="axisL"/>
    </g>
    <text x="0" y="-32" text-anchor="middle" class="lbl">Боковая стенка рокера</text>
    <text x="0" y="-29" text-anchor="middle" class="qty">2 шт (зеркально-одинаковые)</text>
    <text x="0" y="32" text-anchor="middle" class="dim">350 × 350</text>
    <text x="0" y="35" text-anchor="middle" class="ds">вырез сверху: полукруг R=100</text>
    <text x="0" y="37.5" text-anchor="middle" class="ds">2 PTFE-пятака в вырезе через 90°</text>
  </g>

  <!-- Part 3B: Front wall 350x200 -->
  <g transform="translate(105,185)">
    <g transform="scale(0.1429)">
      <rect x="-175" y="-100" width="350" height="200" class="part"/>
      <!-- screw holes along edges (sample) -->
      <circle cx="-160" cy="-85" r="2.5" class="hole"/>
      <circle cx="160" cy="-85" r="2.5" class="hole"/>
      <circle cx="-160" cy="85" r="2.5" class="hole"/>
      <circle cx="160" cy="85" r="2.5" class="hole"/>
    </g>
    <text x="0" y="-22" text-anchor="middle" class="lbl">Передняя стенка</text>
    <text x="0" y="-19" text-anchor="middle" class="qty">1 шт</text>
    <text x="0" y="20" text-anchor="middle" class="dim">350 × 200</text>
    <text x="0" y="23" text-anchor="middle" class="ds">саморезы к боковинам по торцу</text>
  </g>

  <!-- Part 3C: Bottom 350x350 -->
  <g transform="translate(173,185)">
    <g transform="scale(0.1429)">
      <rect x="-175" y="-175" width="350" height="350" class="part"/>
      <!-- center hole Ø10 for M10 axle -->
      <circle cx="0" cy="0" r="5" class="hole"/>
      <line x1="-25" y1="0" x2="25" y2="0" class="axisL"/>
      <line x1="0" y1="-25" x2="0" y2="25" class="axisL"/>
    </g>
    <text x="0" y="-32" text-anchor="middle" class="lbl">Дно рокера</text>
    <text x="0" y="-29" text-anchor="middle" class="qty">1 шт</text>
    <text x="0" y="32" text-anchor="middle" class="dim">350 × 350</text>
    <text x="0" y="35" text-anchor="middle" class="ds">центр.отв. Ø 10 под M10</text>
    <text x="0" y="37.5" text-anchor="middle" class="ds">(сквозь дно + ground board)</text>
  </g>

  <!-- ============ SECTION 4: GROUND BOARD ============ -->
  <rect x="0" y="225" width="210" height="4.5" class="secbar"/>
  <text x="3" y="228.6" class="sech">4.  GROUND BOARD (опорная плита)  ·  1 деталь  ·  лист 80×120</text>

  <g transform="translate(70,258)">
    <g transform="scale(0.12)">
      <rect x="-200" y="-200" width="400" height="400" class="part"/>
      <!-- center hole Ø10 -->
      <circle cx="0" cy="0" r="6" class="hole"/>
      <!-- 3 PTFE pads on R=150, angles 90/210/330 -->
      <circle cx="0" cy="-150" r="10" class="hole"/>
      <circle cx="129.9" cy="75" r="10" class="hole"/>
      <circle cx="-129.9" cy="75" r="10" class="hole"/>
      <!-- 3 rubber feet on bottom, R=170, offset 60° from PTFE (at 30/150/270) -->
      <circle cx="0" cy="170" r="13" fill="none" stroke="#888" stroke-width="0.7" stroke-dasharray="4,2.5"/>
      <circle cx="-147.2" cy="-85" r="13" fill="none" stroke="#888" stroke-width="0.7" stroke-dasharray="4,2.5"/>
      <circle cx="147.2" cy="-85" r="13" fill="none" stroke="#888" stroke-width="0.7" stroke-dasharray="4,2.5"/>
      <!-- radii guides -->
      <line x1="0" y1="0" x2="0" y2="-150" class="axisL"/>
      <line x1="-30" y1="0" x2="30" y2="0" class="axisL"/>
      <line x1="0" y1="-30" x2="0" y2="30" class="axisL"/>
    </g>
    <text x="0" y="-27" text-anchor="middle" class="lbl">Ground board · 1 шт</text>
    <text x="0" y="28" text-anchor="middle" class="dim">квадрат 400 × 400</text>
    <text x="0" y="31" text-anchor="middle" class="ds">центр Ø 10 под ось M10×60  ·  3 PTFE на R=150 через 120°</text>
    <text x="0" y="33.5" text-anchor="middle" class="ds">(пунктир — 3 рез. ножки снизу, между PTFE)</text>
  </g>

  <!-- РАСКРОЙ — текстовая сводка справа от ground board -->
  <g transform="translate(140,237)">
    <text x="0" y="0" class="lbl">РАСКРОЙ ПО ЛИСТАМ</text>

    <text x="0" y="6" class="dim" font-weight="bold">Лист 1 — 600 × 1200 мм</text>
    <text x="0" y="9.5" class="ds">• 1× Y-пластина (Ø250)</text>
    <text x="0" y="12.5" class="ds">• 2× кольца люльки (Ø320)</text>
    <text x="0" y="15.5" class="ds">• 1× передн. пластина (Ø215)</text>
    <text x="0" y="18.5" class="ds">• 2× подшипника (Ø200)</text>

    <text x="0" y="25" class="dim" font-weight="bold">Лист 2 — 800 × 1200 мм</text>
    <text x="0" y="28.5" class="ds">• 2× бок рокера (350×350)</text>
    <text x="0" y="31.5" class="ds">• 1× дно рокера (350×350)</text>
    <text x="0" y="34.5" class="ds">• 1× передн. рокера (350×200)</text>
    <text x="0" y="37.5" class="ds">• 1× ground board (400×400)</text>

    <text x="0" y="44" class="nt" font-weight="bold">Подсказка:</text>
    <text x="0" y="46.5" class="nt">круги размечать циркулем</text>
    <text x="0" y="49" class="nt">из самодельной рейки</text>
    <text x="0" y="51.5" class="nt">(гвоздь + карандаш на L=R).</text>
  </g>

  <!-- FOOTER NOTES -->
  <rect x="0" y="287" width="210" height="10" fill="#ecf0f1"/>
  <text x="3" y="291" class="nt" fill="#222" font-weight="bold">Замечания:</text>
  <text x="3" y="294" class="nt">• Кромки шлифовать P120 → P400. • Сверлить Ø 10 насквозь дно рокера + ground board совместно — точная соосность оси.</text>
  <text x="3" y="296.8" class="nt">• Все отверстия Ø размечать ПОСЛЕ раскроя по месту. • Углы рокер-бокса — саморезы 4×60 в торец + клей D3 (или брусок 30×30).</text>
</svg>
</body></html>
