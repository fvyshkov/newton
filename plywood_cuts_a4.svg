<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210.0mm" height="297.0mm" viewBox="0 0 210.0 297.0" font-family="Helvetica, Arial, sans-serif">
  <style>
    .ttl { font: bold 5px Helvetica; fill: #fff; }
    .sub { font: 2.6px Helvetica; fill: #cfd8dc; }
    .sech { font: bold 3.1px Helvetica; fill: #fff; }
    .lbl { font: bold 2.7px Helvetica; fill: #1a2b3c; }
    .qty { font: bold 2.3px Helvetica; fill: #b8860b; }
    .nt { font: italic 2.0px Helvetica; fill: #555; }
    .dim { font: 2.4px Helvetica; fill: #c0392b; }
    .ds { font: 2.0px Helvetica; fill: #c0392b; }
    .src { font: italic 1.7px Helvetica; fill: #888; }
    .part { fill: #fdf6e3; stroke: #2c3e50; stroke-width: 0.5; }
    .hole { fill: white; stroke: #1565c0; stroke-width: 0.35; }
    .vent { fill: white; stroke: #1565c0; stroke-width: 0.4; }
    .env { fill: none; stroke: #888; stroke-width: 0.25; stroke-dasharray: 1.2,1.0; }
    .axisL { stroke: #999; stroke-width: 0.18; stroke-dasharray: 0.8,0.8; fill: none; }
    .ftLn { stroke: #888; stroke-width: 0.4; stroke-dasharray: 3,2; fill: none; }
    .secbar { fill: #34495e; }
  </style>
<rect x="0" y="0" width="210.0" height="13" fill="#1a2b3c"/>
<text x="105.0" y="6" text-anchor="middle" class="ttl">ВЫПИЛЫ ИЗ ФАНЕРЫ 18 мм</text>
<text x="105.0" y="10" text-anchor="middle" class="sub">Ньютон 200/1200 Dobson · Stellafane-стиль · масштаб видов 1:8 · размеры в мм</text>
<rect x="0" y="14" width="210.0" height="4.5" class="secbar"/>
<text x="3" y="17.3" class="sech">1.  ОПРАВА ЗЕРКАЛА (Seronik-style)  ·  2 детали  ·  лист 60×120</text>
<g transform="translate(50,50)"><g transform="scale(0.125)">
<circle cx="0" cy="0" r="107.5" class="part"/>
<circle cx="0" cy="0" r="30.0" class="vent"/>
<circle cx="0.00" cy="-71.00" r="3.0" class="hole"/>
<circle cx="61.49" cy="35.50" r="3.0" class="hole"/>
<circle cx="-61.49" cy="35.50" r="3.0" class="hole"/>
<circle cx="48.50" cy="-28.00" r="3.0" class="hole"/>
<circle cx="0.00" cy="56.00" r="3.0" class="hole"/>
<circle cx="-48.50" cy="-28.00" r="3.0" class="hole"/>
<line x1="-104.5" y1="0" x2="104.5" y2="0" class="axisL"/>
<line x1="0" y1="-104.5" x2="0" y2="104.5" class="axisL"/>
</g>
<text x="0" y="-19" text-anchor="middle" class="lbl">Передняя пластина</text>
<text x="0" y="-16" text-anchor="middle" class="qty">1 шт</text>
<text x="0" y="20" text-anchor="middle" class="dim">круг Ø 215  ·  вент. отв. Ø 60 в центре</text>
<text x="0" y="23" text-anchor="middle" class="ds">3 нажимных Ø 6 на R=71 (по ушам Y, через 120°)</text>
<text x="0" y="25.5" text-anchor="middle" class="ds">3 прижимных Ø 6 на R=56 (между нажимными)</text>
</g>
<g transform="translate(155,50)"><g transform="scale(0.125)">
<circle cx="0" cy="0" r="125.0" class="env"/>
<path d="M 74.68,-43.12 A 75,75 0 1,0 -74.68,-43.12 A 75,75 0 1,0 0,86.24 A 75,75 0 1,0 74.68,-43.12 Z" class="part"/>
<circle cx="0.00" cy="-71.00" r="3.0" class="hole"/>
<circle cx="61.49" cy="35.50" r="3.0" class="hole"/>
<circle cx="-61.49" cy="35.50" r="3.0" class="hole"/>
<circle cx="48.50" cy="-28.00" r="3.0" class="hole"/>
<circle cx="0.00" cy="56.00" r="3.0" class="hole"/>
<circle cx="-48.50" cy="-28.00" r="3.0" class="hole"/>
<circle cx="0.00" cy="-115.00" r="2.5" class="hole"/>
<circle cx="99.59" cy="57.50" r="2.5" class="hole"/>
<circle cx="-99.59" cy="57.50" r="2.5" class="hole"/>
<line x1="-20" y1="0" x2="20" y2="0" class="axisL"/>
<line x1="0" y1="-20" x2="0" y2="20" class="axisL"/>
</g>
<text x="0" y="-19" text-anchor="middle" class="lbl">Задняя Y-пластина</text>
<text x="0" y="-16" text-anchor="middle" class="qty">1 шт</text>
<text x="0" y="22" text-anchor="middle" class="dim">3 уха вписаны в Ø 250 (= ID трубы)</text>
<text x="0" y="25" text-anchor="middle" class="ds">6 сквозных Ø 6 совпадают с передней пластиной</text>
<text x="0" y="27.5" text-anchor="middle" class="ds">3 отв. Ø 5 в ушах (R=115) под шурупы к трубе</text>
</g>
<rect x="0" y="80" width="210.0" height="4.5" class="secbar"/>
<text x="3" y="83.3" class="sech">2.  ЛЮЛЬКА (кольца+бруски) + ВЫСОТНЫЕ ПОДШИПНИКИ  ·  лист 60×120</text>
<g transform="translate(50,115)"><g transform="scale(0.125)">
<circle cx="0" cy="0" r="160.0" class="part"/>
<circle cx="0" cy="0" r="131.0" fill="white" stroke="#2c3e50" stroke-width="0.5"/>
<circle cx="102.88" cy="102.88" r="2.0" class="hole"/>
<circle cx="-102.88" cy="102.88" r="2.0" class="hole"/>
<circle cx="-102.88" cy="-102.88" r="2.0" class="hole"/>
<circle cx="102.88" cy="-102.88" r="2.0" class="hole"/>
<line x1="-20" y1="0" x2="20" y2="0" class="axisL"/>
<line x1="0" y1="-20" x2="0" y2="20" class="axisL"/>
</g>
<text x="0" y="-23" text-anchor="middle" class="lbl">Кольцо люльки</text>
<text x="0" y="-20" text-anchor="middle" class="qty">2 шт (одинаковые)</text>
<text x="0" y="23" text-anchor="middle" class="dim">OD 320  ·  ID 262 (= труба + 4мм)</text>
<text x="0" y="26" text-anchor="middle" class="ds">4 отв. Ø 4 на R=146 (по углам, под брус 30×30)</text>
<text x="0" y="28.5" text-anchor="middle" class="src">2 кольца соединить брусками 30×30×300мм (= длина люльки)</text>
</g>
<g transform="translate(155,115)"><g transform="scale(0.125)">
<circle cx="0" cy="0" r="190.0" class="part"/>
<line x1="-195.0" y1="0" x2="195.0" y2="0" class="ftLn"/>
<circle cx="-116.67" cy="-116.67" r="2.0" class="hole"/>
<circle cx="0.00" cy="-165.00" r="2.0" class="hole"/>
<circle cx="116.67" cy="-116.67" r="2.0" class="hole"/>
<circle cx="-116.67" cy="116.67" r="2.0" class="hole"/>
<circle cx="0.00" cy="165.00" r="2.0" class="hole"/>
<circle cx="116.67" cy="116.67" r="2.0" class="hole"/>
</g>
<text x="0" y="-27" text-anchor="middle" class="lbl">Диск подшипников</text>
<text x="0" y="-24" text-anchor="middle" class="qty">1 диск → 2 полукруга</text>
<text x="0" y="27" text-anchor="middle" class="dim">круг Ø 380 (= 1.47×OD трубы)</text>
<text x="0" y="30" text-anchor="middle" class="ds">распилить пополам → 2 полукруглых подшипника</text>
<text x="0" y="32.5" text-anchor="middle" class="ds">3 отв. Ø 4 в каждой половине к боку люльки</text>
<text x="0" y="35" text-anchor="middle" class="src">обклеить торец PTFE-полосой 25 мм</text>
</g>
<rect x="0" y="150" width="210.0" height="4.5" class="secbar"/>
<text x="3" y="153.3" class="sech">3.  РОКЕР-БОКС  ·  4 детали  ·  лист 80×120</text>
<g transform="translate(45,195)"><g transform="scale(0.125)">
<path d="M -155.0,-190.0 A 192.0,192.0 0 0,0 155.0,-190.0 L 155.0,190.0 L -155.0,190.0 Z" class="part"/>
<circle cx="123.42" cy="-156.23" r="10" class="hole"/>
<circle cx="-123.42" cy="-156.23" r="10" class="hole"/>
<line x1="-15" y1="0" x2="15" y2="0" class="axisL"/>
<line x1="0" y1="-15" x2="0" y2="15" class="axisL"/>
<line x1="0" y1="-111.31" x2="0" y2="185.0" class="axisL"/>
</g>
<text x="0" y="-29" text-anchor="middle" class="lbl">Боковая стенка</text>
<text x="0" y="-26" text-anchor="middle" class="qty">2 шт</text>
<text x="0" y="27" text-anchor="middle" class="dim">310 × 380</text>
<text x="0" y="29.5" text-anchor="middle" class="ds">вырез R=192, глубина ≈ 79 мм</text>
<text x="0" y="32" text-anchor="middle" class="ds">2 PTFE-пятака через 80° на дуге</text>
</g>
<g transform="translate(105,195)"><g transform="scale(0.125)">
<rect x="-175.0" y="-175.0" width="350" height="350" class="part"/>
<circle cx="-160" cy="-160" r="2.5" class="hole"/>
<circle cx="-160" cy="160" r="2.5" class="hole"/>
<circle cx="160" cy="-160" r="2.5" class="hole"/>
<circle cx="160" cy="160" r="2.5" class="hole"/>
</g>
<text x="0" y="-25" text-anchor="middle" class="lbl">Передняя стенка</text>
<text x="0" y="-22" text-anchor="middle" class="qty">1 шт</text>
<text x="0" y="25" text-anchor="middle" class="dim">350 × 350</text>
<text x="0" y="28" text-anchor="middle" class="ds">саморезы в торец боковин (4×60)</text>
</g>
<g transform="translate(170,195)"><g transform="scale(0.125)">
<circle cx="0" cy="0" r="190.0" class="part"/>
<circle cx="0" cy="0" r="5.0" class="hole"/>
<line x1="-15" y1="0" x2="15" y2="0" class="axisL"/>
<line x1="0" y1="-15" x2="0" y2="15" class="axisL"/>
</g>
<text x="0" y="-28" text-anchor="middle" class="lbl">Дно рокера (круг!)</text>
<text x="0" y="-25" text-anchor="middle" class="qty">1 шт</text>
<text x="0" y="28" text-anchor="middle" class="dim">круг Ø 380</text>
<text x="0" y="31" text-anchor="middle" class="ds">центр Ø 10 под M10 (сверлить вместе с ground board)</text>
</g>
<rect x="0" y="232" width="210.0" height="4.5" class="secbar"/>
<text x="3" y="235.3" class="sech">4.  GROUND BOARD (опорная плита)  ·  1 деталь  ·  лист 80×120</text>
<g transform="translate(50,265)"><g transform="scale(0.1)">
<circle cx="0" cy="0" r="200.0" class="part"/>
<circle cx="0" cy="0" r="5.0" class="hole"/>
<circle cx="0.00" cy="-150.00" r="10" class="hole"/>
<circle cx="129.90" cy="75.00" r="10" class="hole"/>
<circle cx="-129.90" cy="75.00" r="10" class="hole"/>
<circle cx="147.22" cy="-85.00" r="15" fill="none" stroke="#888" stroke-width="0.7" stroke-dasharray="3,2"/>
<circle cx="0.00" cy="170.00" r="15" fill="none" stroke="#888" stroke-width="0.7" stroke-dasharray="3,2"/>
<circle cx="-147.22" cy="-85.00" r="15" fill="none" stroke="#888" stroke-width="0.7" stroke-dasharray="3,2"/>
<line x1="-20" y1="0" x2="20" y2="0" class="axisL"/>
<line x1="0" y1="-20" x2="0" y2="20" class="axisL"/>
</g>
<text x="0" y="-23" text-anchor="middle" class="lbl">Ground board · 1 шт</text>
<text x="0" y="24" text-anchor="middle" class="dim">круг Ø 400</text>
<text x="0" y="26.5" text-anchor="middle" class="ds">центр Ø 10 под ось M10</text>
<text x="0" y="29" text-anchor="middle" class="ds">3 PTFE на R=150 через 120°</text>
<text x="0" y="31.5" text-anchor="middle" class="src">пунктир — 3 рез. ножки на R=170</text>
</g>
<g transform="translate(105,243)">
<text x="0" y="0" class="lbl">ОТЛИЧИЯ от предыдущей версии:</text>
<text x="0" y="4.5" class="ds">• Подшипники: 1 диск Ø380 распилен пополам</text>
<text x="0" y="7" class="ds">  (вместо 2 кружков Ø200 — слишком мало;</text>
<text x="0" y="9.5" class="ds">  правило Stellafane: 1.2-1.8 × OD трубы)</text>
<text x="0" y="13" class="ds">• Дно рокера КРУГ Ø 380 (был квадрат)</text>
<text x="0" y="16" class="ds">• Ground board КРУГ Ø 400 (был квадрат)</text>
<text x="0" y="19" class="ds">• Вырез боковины рокера — теперь вниз ✓</text>
<text x="0" y="22" class="ds">• Y-пластина: 6 сквозных болтовых отв.</text>
<text x="0" y="24.5" class="ds">  (раньше совсем отсутствовали)</text>
<text x="0" y="28" class="src">Формулы: stellafane.org/tm/dob/mount/</text>
<text x="0" y="30.5" class="src">Цели: mirror 8" / sonotube ID250 OD258 / 18мм ply</text>
</g>
<rect x="0" y="287" width="210.0" height="10" fill="#ecf0f1"/>
<text x="3" y="291" class="nt" font-weight="bold" fill="#222">Замечания:</text>
<text x="3" y="294" class="nt">• Размеры компромиссные — влезает на 60×120 + 80×120. Для более просторного рокера — лист 100×150.</text>
<text x="3" y="296.8" class="nt">• Дно рокера и ground board сверлить Ø10 совместно — точная соосность оси. Кромки P120→P400.</text>
</svg>
